# =====================================================================
#  TradBot settings
#  Lines starting with # are comments (notes). Change values after ":"
#  Restart the bot after changing this file.
# =====================================================================

# Coins to trade (Binance spot pairs)
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - XRP/USDT
  - DOGE/USDT

# Candle size. 1h = one candle per hour (recommended)
timeframe: 1h

# How often (seconds) the bot scans live prices, checks stop-losses and
# updates the "what the bot sees" panel. Buy decisions happen when a candle closes.
scan_seconds: 30

# How many days of price history to download for research
history_days: 1095          # about 3 years

# ---------------------------------------------------------------------
#  MODE - only "paper" exists in this version (fake money).
#  Real-money trading is intentionally NOT built yet.
# ---------------------------------------------------------------------
mode: paper

paper:
  starting_balance: 10000   # fake USDT
  fee_pct: 0.1              # Binance spot fee per side (%)
  slippage_pct: 0.05        # pessimistic extra cost per fill (%)

# ---------------------------------------------------------------------
#  RISK RULES - the "boss". These ALWAYS apply, to every strategy,
#  including ideas from the AI brain.
# ---------------------------------------------------------------------
risk:
  max_position_pct: 25      # max % of balance in one trade
  max_open_positions: 3     # max trades open at the same time
  daily_loss_limit_pct: 5   # stop trading for the day after -5%
  kill_switch_drawdown_pct: 20   # stop ALL trading after -20% from peak
  min_trade_usdt: 10        # don't open trades smaller than this

# ---------------------------------------------------------------------
#  STRATEGY LAB - how strategies are tested on history
# ---------------------------------------------------------------------
lab:
  population: 300           # strategy ideas per generation (CLI "lab" command)
  generations: 4
  min_trades: 30            # ignore strategies with fewer trades (luck)
  max_drawdown_pct: 20      # ignore strategies that fell more than this
  # Split of history: research | validation (unseen) | final test (unseen)
  split: [0.6, 0.2, 0.2]
  batch_size: 50            # smaller = less memory, slower (low-end PC)

# ---------------------------------------------------------------------
#  NON-STOP RESEARCH - the bot never stops inventing and testing
# ---------------------------------------------------------------------
research:
  enabled: true
  round_population: 150     # new ideas per round (plus ideas evolved from the best)
  round_generations: 2      # improvement rounds inside each research round
  pause_seconds: 20         # short break between rounds (bigger = PC stays cooler)
  refresh_minutes: 60       # download new candles + re-run the live market test
  ai_ideas_every_rounds: 10 # ask the AI brain for ideas every N rounds

# ---------------------------------------------------------------------
#  STRATEGY POOL - new -> live market test -> LIVE -> retired
# ---------------------------------------------------------------------
pool:
  max_size: 300             # strategies being tested at the same time
  max_live: 10              # strategies allowed to trade the paper account
  min_live: 3               # if fewer are proven, best new ones trade on probation
  promote_after_trades: 5   # live-market-test trades needed before promotion
  promote_min_profit_factor: 1.1
  retire_after_trades: 6
  retire_if_profit_factor_below: 0.9
  retire_if_return_below_pct: -3.0

# ---------------------------------------------------------------------
#  MACHINE LEARNING model (LightGBM)
# ---------------------------------------------------------------------
ml:
  enabled: true
  horizon_bars: 12          # predict price 12 candles (hours) ahead
  target_pct: 0.6           # "up" means at least +0.6% (covers fees)
  threads: 2                # CPU threads (keep low on a weak PC)

# ---------------------------------------------------------------------
#  AI BRAIN - an LLM that suggests ideas, reviews trades, writes reports
#  provider: gemini | claude | none
#  Put your API key in the dashboard Settings page (saved in .env file)
# ---------------------------------------------------------------------
brain:
  provider: gemini
  gemini_model: gemini-flash-latest
  claude_model: claude-opus-5-5
  review_trades: true       # AI may BLOCK a trade (never force one)
  suggest_strategies: true  # AI suggests ideas for the Strategy Lab
  daily_report: true
  use_news: true            # Gemini: search the web for crypto news
  max_calls_per_hour: 20    # stay well inside free-tier limits

# ---------------------------------------------------------------------
#  Dashboard (opens in your web browser)
# ---------------------------------------------------------------------
dashboard:
  host: 127.0.0.1           # only your own PC can open it
  port: 8050
