# Runs all tests on Linux AND Windows on every update, plus a real start of the bot.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install libraries (same installer the bot uses)
        run: |
          python -m pip install --upgrade pip
          python main.py install
          python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Start the bot and check the dashboard (Linux)
        if: runner.os == 'Linux'
        run: |
          python main.py run --no-browser > bot.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8050/api/state > state.json && break; sleep 3; done
          python -c "import json; d=json.load(open('state.json')); print('version', d['version'], 'coins', len(d['symbols'])); assert d['version']"
          curl -sf http://127.0.0.1:8050/ | grep -q "TradBot"
          tail -20 bot.log
      - name: Start the bot and check the dashboard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "main.py","run","--no-browser" -PassThru -RedirectStandardOutput bot.log -RedirectStandardError bot.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8050/api/state; $ok = $true; break } catch { Start-Sleep 3 }
          }
          Get-Content bot.log -Tail 20
          if (-not $ok) { Get-Content bot.err -Tail 40; exit 1 }
          $d = $r.Content | ConvertFrom-Json
          Write-Output "version $($d.version), coins $($d.symbols.Count)"
          Stop-Process -Id $p.Id -Force
