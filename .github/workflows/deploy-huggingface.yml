# Copies the bot to your Hugging Face Space on every update.
# Setup (once): GitHub repo -> Settings -> Secrets and variables -> Actions
#   Secret   HF_TOKEN  = Hugging Face token with WRITE permission
#   Variable HF_SPACE  = your Space, e.g. "yourname/tradbot"
# Nothing happens until HF_SPACE is set.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main, claude/gifted-ptolemy-4nosha]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push code to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          OWNER="${HF_SPACE%%/*}"
          git clone "https://${OWNER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" /tmp/space
          rsync -a --delete --exclude .git --exclude .github --exclude data --exclude .env \
                --exclude tests ./ /tmp/space/
          cp deploy/huggingface/README.md /tmp/space/README.md
          cd /tmp/space
          git config user.name "tradbot-deploy"
          git config user.email "deploy@users.noreply.huggingface.co"
          git add -A
          if git diff --cached --quiet; then echo "Space already up to date"; exit 0; fi
          git commit -m "Deploy TradBot ${GITHUB_SHA::7}"
          git push
